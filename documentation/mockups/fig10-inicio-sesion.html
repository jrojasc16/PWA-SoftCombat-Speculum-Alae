<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figura 10 — Inicio de sesión (mockup)</title>
    <link rel="stylesheet" href="../../prototype/app/static/css/estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <a class="marca" href="#">Speculum-Alae</a>

      <input
        type="checkbox"
        id="nav-toggle"
        class="nav-toggle-oculto"
        aria-hidden="true"
      />
      <label for="nav-toggle" class="nav-toggle" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </label>

      <nav class="navegacion" aria-label="Principal">
        <a href="#">Ranking</a>
        <a href="#">Iniciar sesión</a>
        <a class="boton" href="#">Registrarse</a>
      </nav>
    </header>

    <main class="contenido">
      <section class="tarjeta tarjeta-estrecha">
        <h1>Iniciar sesión</h1>

        <form class="formulario">
          <label for="email">Correo electrónico o nickname</label>
          <input
            type="text"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="tu@correo.com o tu_nickname"
          />

          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
          />

          <button type="submit" class="boton">Iniciar sesión</button>
        </form>

        <p class="enlace-secundario">
          <a href="#">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="enlace-secundario">
          ¿Aún no tienes cuenta?
          <a href="#">Regístrate aquí</a>.
        </p>
      </section>
    </main>

    <footer class="pie">
      <p>Comunidad SoftCombat Speculum-Alae — ranking Elo (reglamento Art. 30).</p>
    </footer>
  </body>
</html>
