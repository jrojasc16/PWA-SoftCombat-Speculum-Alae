{% extends "base.html" %}

{% block titulo %}Iniciar sesión — Speculum-Alae{% endblock %}

{% block contenido %}
<section class="tarjeta tarjeta-estrecha">
  <h1>Iniciar sesión</h1>

  {% if error %}
  <p class="mensaje mensaje-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('ui.login_view', next=next) }}" class="formulario">
    <label for="email">Correo electrónico</label>
    <input
      type="email"
      id="email"
      name="email"
      required
      autocomplete="email"
      value="{{ valores.email if valores else '' }}"
    />

    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      autocomplete="current-password"
    />

    <button type="submit" class="boton">Entrar</button>
  </form>

  <p class="enlace-secundario">
    ¿Aún no tienes cuenta?
    <a href="{{ url_for('ui.registro_view') }}">Regístrate aquí</a>.
  </p>
</section>
{% endblock %}
