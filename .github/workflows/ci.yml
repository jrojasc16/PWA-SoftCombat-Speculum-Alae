name: CI

# Se ejecuta en cada push (incluida la rama de desarrollo de sprints) y en los
# PR hacia main, para que la salida de pytest + cobertura quede guardada como
# evidencia en cada tarea (Sprint 3.6).
on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests con cobertura (ranking >= 70 %, RNF007)
        run: >
          python -m pytest -v
          --cov=app.modules.ranking
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=pytest-junit.xml

      - name: Guardar salida de pytest y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-ranking
          path: |
            prototype/coverage.xml
            prototype/pytest-junit.xml
          if-no-files-found: ignore
